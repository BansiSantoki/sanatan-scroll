name: sanatan_scroll

description: Sanatan Scroll - Wisdom for your journey. A premium spiritual wisdom app.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: any

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.1.0

  google_sign_in: ^6.3.0

  flutter_tts: ^4.2.3
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  sqflite: ^2.4.0
  path: ^1.8.3
  path_provider: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sanatan_logo.png"
  adaptive_icon_background: "#E9CA9B"
  adaptive_icon_foreground: "assets/images/sanatan_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/